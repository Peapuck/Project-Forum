spring.application.name=project_forum
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/project_forum
spring.datasource.username=postgres
spring.datasource.password=postgres5050
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

ai.provider=${AI_PROVIDER:ollama}
ai.model=${AI_MODEL:llama3:latest}
ollama.url=${OLLAMA_URL:http://localhost:11434}
openai.api-key=${OPENAI_API_KEY:}
